[package]
name = "secretshape"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Does this string look like a secret? Provider-prefix rules, structural checks and entropy heuristics for detecting credential-shaped text."
repository = "https://github.com/klappstuhlpy/secretshape"
documentation = "https://docs.rs/secretshape"
readme = "README.md"
keywords = ["secrets", "credentials", "detection", "security", "redaction"]
categories = ["text-processing", "development-tools"]
exclude = [".claude/", ".github/"]

[features]
default = ["rules"]
# The severity-tagged provider rule engine (pulls in `regex`). Without it the
# crate is dependency-free: heuristics (prefixes, JWT, PEM, entropy) only.
rules = ["dep:regex"]
# Serialize `Finding`/`Severity` (dashboards, JSON APIs).
serde = ["dep:serde"]

[dependencies]
regex = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "detect"
harness = false
required-features = ["rules"]

[package.metadata.docs.rs]
all-features = true
